# PoC runner for bug bounty report /reports/4119988
# (instant-debits forged return-URL acceptance, stripe-ios @ 1b2376b647)
#
# Executes FCLiteInstantDebitsForgedReturnURLTests on a macOS runner:
# real WKWebView + real network navigation to a loopback origin whose document
# forges stripe-auth://link-accounts/success?... completion query parameters.
name: poc-instant-debits-forged-return-url

on:
  workflow_dispatch:
  push:
    branches: [poc/instant-debits-forged-return-url]

jobs:
  poc:
    name: Forged return-URL PoC test
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Create simulator (any available iOS runtime)
        run: |
          set -euo pipefail
          RUNTIME_ID=$(xcrun simctl list runtimes --json | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin).get('runtimes', [])
          ios = [r for r in runtimes if r.get('isAvailable') and r.get('platform') == 'iOS']
          if not ios:
              sys.exit('no available iOS runtime on runner')
          print(ios[-1]['identifier'])
          ")
          DEVICE_TYPE=$(xcrun simctl list devicetypes --json | python3 -c "
          import json, sys
          types = json.load(sys.stdin).get('devicetypes', [])
          phones = [t for t in types if 'iPhone' in t.get('identifier', '')]
          if not phones:
              sys.exit('no iPhone devicetypes on runner')
          for pref in ['iPhone-16', 'iPhone-15', 'iPhone-14', 'iPhone-13', 'iPhone-12']:
              for t in phones:
                  if pref in t['identifier']:
                      print(t['identifier'])
                      raise SystemExit
          print(phones[-1]['identifier'])
          ")
          echo "Using runtime=$RUNTIME_ID deviceType=$DEVICE_TYPE"
          UDID=$(xcrun simctl create "PoC iPhone" "$DEVICE_TYPE" "$RUNTIME_ID")
          echo "Created simulator $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true

      - name: Run PoC test
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -workspace Stripe.xcworkspace \
            -scheme StripeFinancialConnectionsLite \
            -destination "id=${UDID},arch=arm64" \
            -only-testing:StripeFinancialConnectionsLiteTests/FCLiteInstantDebitsForgedReturnURLTests \
            -resultBundlePath poc.xcresult \
            SWIFT_SUPPRESS_WARNINGS=YES SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            | tee poc_run.log
          echo "--- evidence gate ---"
          grep -E "\[PoC\] (PASS|completion fired)" poc_run.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-evidence
          path: |
            poc_run.log
            poc.xcresult
          if-no-files-found: warn
